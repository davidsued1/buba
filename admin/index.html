<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel BUBA</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0b0c'/%3E%3Ctext x='50' y='68' font-size='55' font-weight='900' font-family='Arial' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login" id="login">
    <div class="login__box">
      <img class="login__logo-img" src="../assets/img/logo-full.png" alt="BUBA Ready Cocktails">
      <h1>Panel de administración</h1>
      <p class="login__sub">Ingresá el PIN para administrar la tienda.</p>
      <form id="login-form">
        <input type="password" id="login-pin" placeholder="PIN" inputmode="numeric" autocomplete="off" autofocus>
        <button class="btn btn--solid" type="submit">Entrar</button>
      </form>
      <p class="login__err" id="login-err" hidden>PIN incorrecto.</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app" hidden>
    <!-- Barra superior: siempre a la vista, con el botón de publicar -->
    <header class="topbar">
      <button class="topbar__menu" id="btn-menu" aria-label="Menú">☰</button>
      <h2 id="view-title">Inicio</h2>
      <div class="topbar__actions">
        <span class="save-state" id="save-state"></span>
        <button class="btn btn--solid btn--sm" id="btn-publish">Publicar</button>
      </div>
    </header>

    <!-- Menú lateral (se despliega en celular) -->
    <aside class="sidebar" id="sidebar">
      <p class="sidebar__logo"><img src="../assets/img/logo-buba-white.png" alt="BUBA"> <small>panel</small></p>
      <nav class="sidebar__nav" id="side-nav">
        <button data-view="dashboard" class="is-active">📊 Inicio</button>
        <button data-view="orders">📦 Pedidos <span class="badge" id="badge-orders"></span></button>
        <button data-view="products">🥫 Productos y fotos</button>
        <button data-view="texts">✏️ Textos de la web</button>
        <button data-view="images">🖼️ Fotos de la web</button>
        <button data-view="clients">👥 Clientes</button>
        <button data-view="shipping">🚚 Envíos</button>
        <button data-view="promos">🏷️ Promociones</button>
        <button data-view="settings">⚙️ Configuración</button>
      </nav>
      <div class="sidebar__foot">
        <a href="../index.html" target="_blank">Ver la web →</a>
        <button id="logout" class="linklike">Salir</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <main class="main">
      <div class="view" id="view"></div>
    </main>

    <!-- Accesos rápidos abajo, como una app -->
    <nav class="tabbar" id="tabbar">
      <button data-view="dashboard" class="is-active"><span>📊</span>Inicio</button>
      <button data-view="orders"><span>📦</span>Pedidos</button>
      <button data-view="products"><span>🥫</span>Productos</button>
      <button data-view="texts"><span>✏️</span>Textos</button>
      <button data-view="images"><span>🖼️</span>Fotos</button>
    </nav>
  </div>

  <!-- Modal genérico -->
  <div class="modal-overlay" id="modal-overlay" hidden></div>
  <div class="modal" id="modal" hidden>
    <div class="modal__head">
      <h3 id="modal-title"></h3>
      <button class="modal__close" id="modal-close">✕</button>
    </div>
    <div class="modal__body" id="modal-body"></div>
  </div>

  <script src="../js/store-defaults.js"></script>
  <script src="admin.js"></script>
</body>
</html>
