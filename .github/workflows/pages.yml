# Deploy automático de la web BUBA a GitHub Pages.
# Cada push a main (incluido "Publicar online" desde el panel) redeploya el sitio.
name: Deploy a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/buba-web-minimal-design-5k85u5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Marca los CSS/JS con el commit actual: así el navegador nunca sirve
      # una versión vieja desde su caché después de publicar.
      - name: Versionar assets para evitar caché
        run: |
          V="${GITHUB_SHA::7}"
          grep -rl 'v=dev' --include='*.html' . | xargs sed -i "s/v=dev/v=$V/g"
          echo "Assets versionados como v=$V"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
